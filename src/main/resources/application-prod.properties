# Production environment configuration (Environment-driven)

# Server Configuration
server.port=${PORT:8080}

# Database Connection (Production postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings (Validation strictly enforced)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security CORS Configuration (Whitelisted production origins only)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cookie Security (Required HTTPS)
app.cookie.secure=true

# JWT Secret Parameters (Required env-driven secrets)
app.jwt.secret=${JWT_SECRET}
app.jwt.accessTokenExpirationMs=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# AES-256 Symmetric Encryption Key (Env-driven)
app.encryption.key=${ENCRYPTION_KEY}

# Logging Configurations (JSON aggregation pattern in production)
logging.level.root=WARN
logging.level.com.expense.logger=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [MDC: correlation_id=%X{correlation_id}] %msg%n

# Springdoc OpenAPI Configurations (Swagger)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Enterprise Login & API Rate Limiting Configuration
app.rate-limit.login.max-attempts=${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
app.rate-limit.login.window-minutes=${RATE_LIMIT_LOGIN_WINDOW_MINUTES:1}
app.rate-limit.lockout-minutes=${RATE_LIMIT_LOCKOUT_MINUTES:15}
app.rate-limit.refresh.max-attempts=${RATE_LIMIT_REFRESH_MAX_ATTEMPTS:15}
app.rate-limit.admin.max-attempts=${RATE_LIMIT_ADMIN_MAX_ATTEMPTS:30}

# HTTP Security Headers Configuration
app.security.headers.csp-enabled=${SECURITY_HEADERS_CSP_ENABLED:true}
app.security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:true}
app.security.headers.frame-options=${SECURITY_HEADERS_FRAME_OPTIONS:DENY}
app.security.headers.content-type-options=${SECURITY_HEADERS_CONTENT_TYPE_OPTIONS:nosniff}
app.security.headers.referrer-policy=${SECURITY_HEADERS_REFERRER_POLICY:strict-origin-when-cross-origin}

