# Test environment configuration (In-Memory Database)

# Database Connection (H2 Mem DB)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings (Dynamic tables creation/teardown)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# Security CORS Configuration (Wildcard for mocks)
app.cors.allowed-origins=*

# Cookie Security (Insecure in tests)
app.cookie.secure=false

# JWT Secret Parameters (Static dummy keys)
app.jwt.secret=dummy_test_secret_key_which_is_extremely_long_and_secure_to_meet_the_minimum_byte_requirements
app.jwt.accessTokenExpirationMs=60000
app.jwt.refreshTokenExpirationMs=120000

# AES-256 Symmetric Encryption Key (Base64 encoded 32-byte key)
app.encryption.key=TkdWM2R5aHViV2xqYjJSNWNHVnlaVzUwWVhScGIyND0=

# Logging Configurations
logging.level.root=WARN
logging.level.com.expense.logger=DEBUG

# SMTP Mail Configuration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
