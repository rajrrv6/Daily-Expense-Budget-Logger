# Development environment configuration

# Server Configuration
server.port=8080

# Database Connection (PostgreSQL local instance)
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_logger
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security CORS Configuration (Dev Origins)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Cookie Security (Insecure on local HTTP)
app.cookie.secure=false

# JWT Secret Parameters (Development fallback keys)
app.jwt.secret=9a4f2c8d3b7a1e5f8c6b2a0d9e7f4c3b2a1e0f9c8b7a6d5e4f3c2b1a0d9e8f7c6b5a4d3e2f1c0b9a8f7d6e5f4c3b2a1
app.jwt.accessTokenExpirationMs=900000
app.jwt.refreshTokenExpirationMs=604800000

# Logging Configurations
logging.level.root=INFO
logging.level.com.expense.logger=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [MDC: correlation_id=%X{correlation_id}] %msg%n

# SMTP Mail Configuration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
