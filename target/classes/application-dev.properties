# Database Connection (PostgreSQL local instance)
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_logger
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable PostgreSQL-specific schema.sql from running
spring.sql.init.mode=never

# Security CORS Configuration (Dev Origins)
