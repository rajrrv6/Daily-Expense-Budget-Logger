# Multipart Upload Settings (Limit file size to 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Enterprise Login & API Rate Limiting Configuration
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-minutes=1
app.rate-limit.lockout-minutes=15
app.rate-limit.refresh.max-attempts=15
app.rate-limit.admin.max-attempts=30

# HTTP Security Headers Configuration
app.security.headers.csp-enabled=true
app.security.headers.hsts-enabled=true
app.security.headers.frame-options=DENY
app.security.headers.content-type-options=nosniff
app.security.headers.referrer-policy=strict-origin-when-cross-origin


